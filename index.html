<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthWise - Your Trusted Health </title>
    <meta name="description" content="Get reliable, medically-reviewed health information, symptom checker, and self-care guidance. Trusted by thousands for accurate health insights and wellness tips." />
    <meta name="author" content="HealthWise Medical Information Services" />
    <meta name="keywords" content="health information, symptom checker, medical advice, self-care, wellness, health library, medical conditions" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://healthwise.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://healthwise.app" />
    <meta property="og:title" content="HealthWise - Your Trusted Health & Self-Care Companion" />
    <meta property="og:description" content="Get reliable, medically-reviewed health information, symptom checker, and self-care guidance. Trusted by thousands for accurate health insights." />
    <meta property="og:image" content="https://healthwise.app/og-image.jpg" />
    <meta property="og:site_name" content="HealthWise" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://healthwise.app" />
    <meta property="twitter:title" content="HealthWise - Your Trusted Health & Self-Care Companion" />
    <meta property="twitter:description" content="Get reliable, medically-reviewed health information, symptom checker, and self-care guidance." />
    <meta property="twitter:image" content="https://healthwise.app/og-image.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "HealthWise",
      "description": "Trusted health information and self-care guidance",
      "url": "https://healthwise.app",
      "medicalAudience": {
        "@type": "MedicalAudience",
        "audienceType": "Patient"
      },
      "publisher": {
        "@type": "Organization",
        "name": "HealthWise Medical Information Services",
        "logo": {
          "@type": "ImageObject",
          "url": "https://healthwise.app/logo.png"
        }
      }
    }
    </script>

    <!-- Favicon -->
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
